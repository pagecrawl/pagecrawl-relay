# Build and publish the release binaries, with proof of where they came from.
#
# The binaries are not code-signed (that needs an Apple Developer ID and an
# Authenticode certificate), so this does the next best thing and the thing that
# actually matters for an open-source client: it builds them on GitHub's runners from
# a tagged commit and attaches a signed provenance attestation. Anyone can then check
# that the file they downloaded was built by this workflow, from this source, rather
# than uploaded by hand from somebody's laptop:
#
#   gh attestation verify pagecrawl-relay-darwin-arm64 --repo pagecrawl/pagecrawl-relay
#
# That is a stronger claim than a code signature, which only says an identity paid for
# a certificate. It does not stop Gatekeeper or SmartScreen warning, because those ask
# a different question; see the README.
name: Release

on:
  push:
    tags: ['v*']
  # So a tag that was pushed before this workflow existed can still be built and
  # attested, rather than leaving one release that nobody can verify.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to'
        required: true

permissions:
  contents: write      # create the release and upload assets
  id-token: write      # sign the attestation
  attestations: write  # record it

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          # Follows go.mod, so the build never silently drifts to a different
          # toolchain than the one the tests ran on.
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          # A static binary that runs on any machine of its platform, including the
          # Home Assistant base images and a bare NAS.
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist

          # The names are load-bearing: /downloads/relay/{platform} in the PageCrawl
          # app redirects straight to these, and the docs name them.
          while read -r goos goarch suffix; do
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${TAG}" \
              -o "dist/pagecrawl-relay-${suffix}" .
            echo "built pagecrawl-relay-${suffix}"
          done <<'TARGETS'
          darwin arm64 darwin-arm64
          darwin amd64 darwin-amd64
          linux amd64 linux-amd64
          linux arm64 linux-arm64
          windows amd64 windows-amd64.exe
          TARGETS

          cd dist && sha256sum pagecrawl-relay-* > SHA256SUMS && cat SHA256SUMS

      - name: Attest the builds
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/pagecrawl-relay-*'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"

          # A tag push does not create a release, so make one if it is missing. Doing
          # it here rather than by hand keeps the assets and the release notes from
          # ever describing different builds.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi

          # --clobber so re-running a build replaces the assets rather than failing
          # half way and leaving a release with some files from each attempt.
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
