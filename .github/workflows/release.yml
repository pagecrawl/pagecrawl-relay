# Build release binaries from a tagged commit and attach signed provenance.
# Verify a downloaded binary with:
#
#   gh attestation verify pagecrawl-relay-darwin-arm64 --repo pagecrawl/pagecrawl-relay
#
# Provenance does not replace platform code signing; see the README.
name: Release

on:
  push:
    tags: ['v*']
  # So a tag that was pushed before this workflow existed can still be built and
  # attested, rather than leaving one release that nobody can verify.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to'
        required: true

permissions:
  contents: write      # create the release and upload assets
  id-token: write      # sign the attestation
  attestations: write  # record it

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          # Keep release builds, the Docker builder and security checks aligned.
          # go.mod declares source compatibility, not the release toolchain.
          go-version: '1.27.1'
          cache: true

      - name: Vet, test and scan
        run: |
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 GOARCH=386 go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build
        env:
          # A static binary that runs on any machine of its platform, including the
          # Home Assistant base images and a bare NAS.
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist

          # Keep asset names stable for existing download links and documentation.
          while read -r goos goarch suffix; do
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${TAG}" \
              -o "dist/pagecrawl-relay-${suffix}" .
            echo "built pagecrawl-relay-${suffix}"
          done <<'TARGETS'
          darwin arm64 darwin-arm64
          darwin amd64 darwin-amd64
          linux amd64 linux-amd64
          linux arm64 linux-arm64
          windows amd64 windows-amd64.exe
          TARGETS

          cd dist && sha256sum pagecrawl-relay-* > SHA256SUMS && cat SHA256SUMS

      - name: Attest the builds
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/pagecrawl-relay-*'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"

          # A tag push does not create a release, so make one if it is missing. Doing
          # it here rather than by hand keeps the assets and the release notes from
          # ever describing different builds.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi

          # --clobber so re-running a build replaces the assets rather than failing
          # half way and leaving a release with some files from each attempt.
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
