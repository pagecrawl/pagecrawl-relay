# Build release binaries from a tagged commit and attach signed provenance.
# Verify a downloaded binary with:
#
#   gh attestation verify pagecrawl-relay-darwin-arm64 --repo pagecrawl/pagecrawl-relay
#
# Provenance does not replace platform code signing; see the README.
name: Release

on:
  push:
    tags: ['v*']
  # So a tag that was pushed before this workflow existed can still be built and
  # attested, rather than leaving one release that nobody can verify.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to'
        required: true

permissions:
  contents: write      # create the release and upload assets
  id-token: write      # sign the attestation
  attestations: write  # record it

jobs:
  # The macOS assets need a Mac: the menu-bar app is a cgo build, and codesign,
  # notarytool and stapler only exist there. They are built first and handed to the
  # release job, so the checksums and the attestation cover the signed files.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: go.sum

      # The menu-bar build is the one CGO build in the project, so the Linux jobs
      # never compile it. Without this a change to tray.go reaches a release
      # unchecked, and the first sign of a mistake is a failed packaging step.
      - name: Vet the menu-bar build
        run: |
          go vet -tags tray ./...
          go test -race ./...

      - name: Import the signing certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # Never publish an unsigned Mac build. The download links and the README
          # promise a program that opens without a Gatekeeper warning.
          if [ -z "${CERT_BASE64}" ] || [ -z "${NOTARY_KEY_BASE64}" ]; then
            echo "The Developer ID certificate or the notary key is not configured." >&2
            exit 1
          fi

          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "${CERT_BASE64}" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${RUNNER_TEMP}/developer-id.p12" -k "${KEYCHAIN}" \
            -P "${CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          # codesign looks the identity up in the search list, so add ours to it.
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          rm "${RUNNER_TEMP}/developer-id.p12"

          echo "${NOTARY_KEY_BASE64}" | base64 --decode > "${RUNNER_TEMP}/notary-key.p8"
          echo "MACOS_KEYCHAIN=${KEYCHAIN}" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_FILE=${RUNNER_TEMP}/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          MACOS_SIGN_IDENTITY: 'Developer ID Application: Mygtukynas, MB (8V5V2283P6)'
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: packaging/macos/build.sh "$TAG" dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/notary-key.p8"

  release:
    needs: macos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          changelog = Path('CHANGELOG.md').read_text()
          sections = re.findall(
              r'^## ' + re.escape(tag) + r'[ \t]*\n(.*?)(?=^## |\Z)',
              changelog, re.MULTILINE | re.DOTALL,
          )
          if len(sections) != 1 or not sections[0].strip():
              raise SystemExit(f'Add one nonempty "## {tag}" section to CHANGELOG.md before releasing.')
          notes = Path(os.environ['RUNNER_TEMP']) / 'relay-release-notes.md'
          notes.write_text(sections[0].strip() + '\n')
          PY

      - uses: actions/setup-go@v7
        with:
          # Keep release builds, the Docker builder and security checks aligned.
          # go.mod declares source compatibility, not the release toolchain.
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: go.sum

      - name: Vet, test and scan
        run: |
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 GOARCH=386 go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build
        env:
          # A static binary that runs on any machine of its platform, including the
          # Home Assistant base images and a bare NAS.
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist

          # Keep asset names stable for existing download links and documentation.
          while read -r goos goarch suffix; do
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${TAG}" \
              -o "dist/pagecrawl-relay-${suffix}" .
            echo "built pagecrawl-relay-${suffix}"
          done <<'TARGETS'
          linux amd64 linux-amd64
          linux arm64 linux-arm64
          windows amd64 windows-amd64.exe
          TARGETS

      # The signed macOS binaries and app from the macos job, beside the rest so one
      # SHA256SUMS and one attestation cover every desktop download.
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - name: Checksums
        run: cd dist && sha256sum pagecrawl-relay-* > SHA256SUMS && cat SHA256SUMS

      - name: Attest the builds
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/pagecrawl-relay-*'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --notes-file "${RUNNER_TEMP}/relay-release-notes.md"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes-file "${RUNNER_TEMP}/relay-release-notes.md"
          fi

          # --clobber so re-running a build replaces the assets rather than failing
          # half way and leaving a release with some files from each attempt.
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"

  # The image the Docker, NAS and homelab instructions pull. Built for the two
  # architectures those boxes actually run, and published to this repository's own
  # registry, so there is no second account to trust or to keep credentials for.
  docker:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write      # push to ghcr.io/<owner>/<repo>
      id-token: write      # sign the attestation
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The same stamp the binaries carry, so a container reports its version.
          build-args: VERSION=${{ inputs.tag || github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Attest the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The Android relay app, attached to the same release as pagecrawl-relay-android.apk. It
  # runs after the desktop job, which creates the release, and wraps the same relay package.
  android:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: mobile/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test the Android binding
        working-directory: mobile
        run: |
          go vet ./...
          go test -race ./...

      - name: Build the relay library
        run: |
          set -euo pipefail
          # The same golang.org/x/mobile version mobile/go.mod requires: gomobile bind needs
          # its tool and the module's bind package to match, and pinning keeps a release
          # reproducible from its tag.
          MOBILE_VERSION="$(cd mobile && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}"
          # A finite stream of answers rather than `yes`, which is still writing when
          # sdkmanager exits and dies of a broken pipe; with pipefail that killed the step
          # even though the NDK had installed.
          printf 'y\n%.0s' $(seq 1 50) |
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" >/dev/null
          test -d "$ANDROID_HOME/ndk/27.1.12297006"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          gomobile init
          mobile/build-aar.sh

      - name: Build and sign the app
        env:
          RELAY_KEYSTORE_BASE64: ${{ secrets.RELAY_ANDROID_KEYSTORE_BASE64 }}
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_ANDROID_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_ANDROID_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"

          # Never publish a debug-signed build. Every machine has a different debug key, and
          # Android refuses to install an update signed with a different key than the one
          # already on the phone, so a debug-signed release would strand everyone on it.
          if [ -z "${RELAY_KEYSTORE_BASE64}" ]; then
            echo "The release signing key is not configured (RELAY_ANDROID_KEYSTORE_BASE64)." >&2
            exit 1
          fi
          export RELAY_KEYSTORE_FILE="${RUNNER_TEMP}/relay-release.jks"
          echo "${RELAY_KEYSTORE_BASE64}" | base64 --decode > "${RELAY_KEYSTORE_FILE}"

          cd android
          ./gradlew --no-daemon testDebugUnitTest assembleRelease -PrelayVersion="${TAG#v}"

          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/pagecrawl-relay-android.apk
          cd ../dist && sha256sum pagecrawl-relay-android.apk > SHA256SUMS-android && cat SHA256SUMS-android

      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/pagecrawl-relay-android.apk'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/pagecrawl-relay-android.apk dist/SHA256SUMS-android \
            --clobber --repo "${{ github.repository }}"
