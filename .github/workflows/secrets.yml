# Fail any push or pull request that carries a credential: a signing certificate,
# the notary key, a keystore, a relay token or a cloud key. The signing material
# lives only in repository secrets; this catches a copy committed by mistake.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so a secret added and removed again is still caught.
          fetch-depth: 0

      - name: Scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1
